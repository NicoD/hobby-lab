name: Project / backend
run-name: backend / PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "apps/backend/**"
      - "docker-compose.ci.yaml"
      - ".github/workflows/project-backend-ci.yaml"

concurrency:
  group: project-ci-backend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.ci.yaml
  DOCKER_BUILDKIT: 1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: ${{ github.run_id }}_${{ github.run_number }}_lint

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache vendor
        uses: actions/cache@v6
        with:
          path: apps/backend/vendor
          key: ${{ github.repository }}-backend-vendor-${{ hashFiles('apps/backend/composer.lock') }}
          restore-keys: ${{ github.repository }}-backend-vendor-

      - name: Build
        run: docker compose build backend

      - name: Install dependencies
        run: docker compose run --rm -T backend composer install --no-interaction --prefer-dist

      - name: PHP-CS-Fixer
        run: docker compose run --rm -T backend vendor/bin/php-cs-fixer check --diff

      - name: Warm up Symfony cache
        run: docker compose run --rm -T -e APP_ENV=dev backend bin/console cache:warmup

      - name: PHPStan
        run: docker compose run --rm -T backend vendor/bin/phpstan analyse --memory-limit=512M

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: ${{ github.run_id }}_${{ github.run_number }}_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache vendor
        uses: actions/cache@v6
        with:
          path: apps/backend/vendor
          key: ${{ github.repository }}-backend-vendor-${{ hashFiles('apps/backend/composer.lock') }}
          restore-keys: ${{ github.repository }}-backend-vendor-

      - name: Build
        run: docker compose build backend

      - name: Start database
        run: docker compose up -d --wait backend-db

      - name: Install dependencies
        run: docker compose run --rm -T backend composer install --no-interaction --prefer-dist

      - name: Run migrations
        run: docker compose run --rm -T backend bin/console doctrine:migrations:migrate --no-interaction --all-or-nothing

      - name: Run tests
        run: docker compose run --rm -T backend vendor/bin/phpunit

      - name: Teardown
        if: always()
        run: docker compose down --volumes --remove-orphans
