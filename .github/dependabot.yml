---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  - package-ecosystem: "composer"
    directory: "apps/backend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    labels:
      - "dependencies"
      - "PHP"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "apps/backend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 2

  - package-ecosystem: "npm"
    directory: "apps/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "apps/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 2

  - package-ecosystem: "npm"
    directory: "apps/user"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "apps/user"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 2
