services:
  gateway:
    image: traefik:v3.3
    container_name: sandbox-gateway
    ports:
      - "80:80"      # main entrypoint
      - "8080:8080"  # dashboard (sandbox only — http://localhost:8080)
    volumes:
      - ./infra/gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/gateway/dynamic:/etc/traefik/dynamic:ro
    networks:
      - sandbox

  backend:
    build: ./apps/backend
    container_name: sandbox-backend
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
    networks:
      - sandbox

  frontend:
    build: ./apps/frontend
    container_name: sandbox-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost  # browser-side: reaches apps/* through Traefik
    networks:
      - sandbox

  user:
    build: ./apps/user
    container_name: sandbox-user
    ports:
      - "3000:3000"
    volumes:
      - ./apps/user:/app
      - user_node_modules:/app/node_modules
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://identity:identity@identity-db:5432/recipe_identity
      # JWT_PRIVATE_KEY and JWT_PUBLIC_KEY must be set in apps/user/.env (see .env.example)
    env_file:
      - path: ./apps/user/.env
        required: false
    depends_on:
      - identity-db
    networks:
      - sandbox

  identity-db:
    image: postgres:16-alpine
    container_name: sandbox-identity-db
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: recipe_identity
    volumes:
      - identity_db_data:/var/lib/postgresql/data
    networks:
      - sandbox

volumes:
  frontend_node_modules:
  user_node_modules:
  identity_db_data:

networks:
  sandbox:
    driver: bridge
