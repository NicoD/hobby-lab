services:
  gateway:
    image: traefik:v3.3
    container_name: hobbylab-gateway
    ports:
      - "8000:8000"  # main entrypoint
      - "8080:8080"  # dashboard (local only — http://localhost:8080)
    volumes:
      - ./infra/gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/gateway/dynamic:/etc/traefik/dynamic:ro
    networks:
      - hobbylab

  backend:
    build: ./apps/backend
    container_name: hobbylab-backend
    volumes:
      - ./apps/backend:/app
    environment:
      - DATABASE_URL=postgresql://backend:backend@backend-db:5432/hobby_lab
    depends_on:
      backend-db:
        condition: service_healthy
    networks:
      - hobbylab

  backend-db:
    image: postgres:16-alpine
    container_name: hobbylab-backend-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
      POSTGRES_DB: hobby_lab
    volumes:
      - backend_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d hobby_lab"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hobbylab

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: hobbylab-rabbitmq
    ports:
      - "15672:15672"  # management UI — http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: hobbylab
      RABBITMQ_DEFAULT_PASS: hobbylab
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - hobbylab

  backend-worker:
    build: ./apps/backend
    container_name: hobbylab-backend-worker
    command: php bin/console outbox:process
    volumes:
      - ./apps/backend:/app
    environment:
      - DATABASE_URL=postgresql://backend:backend@backend-db:5432/hobby_lab
      - RABBITMQ_DSN=amqp://hobbylab:hobbylab@rabbitmq:5672/%2f
    depends_on:
      backend-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hobbylab

  frontend:
    build: ./apps/frontend
    container_name: hobbylab-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
    networks:
      - hobbylab

  user:
    build: ./apps/user
    container_name: hobbylab-user
    # no ports exposed — only reachable via Traefik on the internal network
    volumes:
      - ./apps/user:/app
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://identity:identity@identity-db:5432/hobby_lab_identity
      # JWT_PRIVATE_KEY and JWT_PUBLIC_KEY must be set in apps/user/.env (see .env.example)
    env_file:
      - path: ./apps/user/.env
        required: false
    depends_on:
      identity-db:
        condition: service_healthy
    networks:
      - hobbylab

  identity-db:
    image: postgres:16-alpine
    container_name: hobbylab-identity-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: hobby_lab_identity
    volumes:
      - identity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d hobby_lab_identity"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hobbylab

volumes:
  identity_db_data:
  backend_db_data:
  rabbitmq_data:

networks:
  hobbylab:
    driver: bridge
