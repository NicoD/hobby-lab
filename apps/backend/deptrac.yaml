parameters:
  paths:
    - ./src
  exclude_files:
    - '#^src/Kernel\.php#'

  layers:
    # ── Shared ────────────────────────────────────────────────────────────────
    - name: Shared.Domain
      collectors:
        - { type: directory, value: 'src/Shared/Domain/.*' }

    - name: Shared.Application
      collectors:
        - { type: directory, value: 'src/Shared/Application/.*' }

    - name: Shared.Infrastructure
      collectors:
        - { type: directory, value: 'src/Shared/Infrastructure/.*' }

    # ── ColorLab.Catalog ──────────────────────────────────────────────────────
    - name: ColorLab.Catalog.Domain
      collectors:
        - { type: directory, value: 'src/ColorLab/Catalog/Domain/.*' }

    - name: ColorLab.Catalog.Application
      collectors:
        - { type: directory, value: 'src/ColorLab/Catalog/Application/.*' }

    - name: ColorLab.Catalog.Infrastructure
      collectors:
        - { type: directory, value: 'src/ColorLab/Catalog/Infrastructure/.*' }

    - name: ColorLab.Catalog.UI
      collectors:
        - { type: directory, value: 'src/ColorLab/Catalog/UI/.*' }

    # ── ColorLab.Stash ────────────────────────────────────────────────────────
    - name: ColorLab.Stash.Domain
      collectors:
        - { type: directory, value: 'src/ColorLab/Stash/Domain/.*' }

    - name: ColorLab.Stash.Application
      collectors:
        - { type: directory, value: 'src/ColorLab/Stash/Application/.*' }

    - name: ColorLab.Stash.Infrastructure
      collectors:
        - { type: directory, value: 'src/ColorLab/Stash/Infrastructure/.*' }

    - name: ColorLab.Stash.UI
      collectors:
        - { type: directory, value: 'src/ColorLab/Stash/UI/.*' }

  ruleset:
    # Shared — never depends on a business domain
    Shared.Domain: []
    Shared.Application:
      - Shared.Domain
    Shared.Infrastructure:
      - Shared.Domain
      - Shared.Application

    # Catalog — strict inward dependency direction
    ColorLab.Catalog.Domain:
      - Shared.Domain
    ColorLab.Catalog.Application:
      - ColorLab.Catalog.Domain
      - Shared.Domain
      - Shared.Application
    ColorLab.Catalog.Infrastructure:
      - ColorLab.Catalog.Domain
      - ColorLab.Catalog.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure
    ColorLab.Catalog.UI:
      - ColorLab.Catalog.Application
      - Shared.Application

    # Stash — may reference Catalog identity VOs (write side: PaintHandle only)
    ColorLab.Stash.Domain:
      - Shared.Domain
      - ColorLab.Catalog.Domain   # Stash\Paint references PaintHandle identity VO
    ColorLab.Stash.Application:
      - ColorLab.Stash.Domain
      - ColorLab.Catalog.Domain   # CreatePaintCommandHandler uses PaintHandle
      - Shared.Domain
      - Shared.Application
    ColorLab.Stash.Infrastructure:
      - ColorLab.Stash.Domain
      - ColorLab.Stash.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure
    ColorLab.Stash.UI:
      - ColorLab.Stash.Application
      - Shared.Application
