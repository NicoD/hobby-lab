monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: notice
            handler: nested
            excluded_http_codes: [404, 405]
        nested:
            type: stream
            path: php://stderr
            level: notice
            formatter: monolog.formatter.json

when@dev:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: debug
                handler: nested
                excluded_http_codes: [404, 405]
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: warning
                handler: nested
                excluded_http_codes: [404, 405]
            nested:
                type: stream
                path: php://stderr
                level: warning
                formatter: monolog.formatter.json
