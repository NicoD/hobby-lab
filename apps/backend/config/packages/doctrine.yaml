doctrine:
    dbal:
        url: '%env(DATABASE_URL)%'
        server_version: '16'
        types:
            catalog_brand_handle: App\ColorLab\Catalog\Infrastructure\Doctrine\Type\BrandHandleType
            catalog_color_handle: App\ColorLab\Catalog\Infrastructure\Doctrine\Type\ColorHandleType
            catalog_paint_type_handle: App\ColorLab\Catalog\Infrastructure\Doctrine\Type\PaintTypeHandleType
            catalog_range_handle: App\ColorLab\Catalog\Infrastructure\Doctrine\Type\RangeHandleType
            catalog_range_collection: App\ColorLab\Catalog\Infrastructure\Doctrine\Type\RangeCollectionType
            catalog_paint_handle: App\ColorLab\Catalog\Infrastructure\Doctrine\Type\PaintHandleType
            stash_paint_id: App\ColorLab\Stash\Infrastructure\Doctrine\Type\PaintIdType
            user_id: App\Shared\Infrastructure\Doctrine\Type\UserIdType

    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            ColorLab.Catalog:
                type: attribute
                dir: '%kernel.project_dir%/src/ColorLab/Catalog/Domain'
                prefix: 'App\ColorLab\Catalog\Domain'
                is_bundle: false
            ColorLab.Stash:
                type: attribute
                dir: '%kernel.project_dir%/src/ColorLab/Stash/Domain'
                prefix: 'App\ColorLab\Stash\Domain'
                is_bundle: false

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
