http:
  routers:
    # /auth/* → apps/user directly, no ForwardAuth
    auth:
      entryPoints:
        - web
      rule: "PathPrefix(`/auth`)"
      service: user

    # One router per domain in apps/backend.
    # Traefik routes by prefix; Symfony sees the full path (/color-lab/brands)
    # and owns the routing inside each bounded context.
    # To add a domain: duplicate the block and update rule + name.

    color-lab:
      entryPoints:
        - web
      rule: "PathPrefix(`/color-lab`)"
      middlewares:
        - forward-auth
      service: backend

    # mini-lab:
    #   entryPoints:
    #     - web
    #   rule: "PathPrefix(`/mini-lab`)"
    #   middlewares:
    #     - forward-auth
    #   service: backend

  services:
    user:
      loadBalancer:
        servers:
          - url: "http://user:3000"

    backend:
      loadBalancer:
        servers:
          - url: "http://backend:8000"
