http:
  middlewares:
    forward-auth:
      forwardAuth:
        # Traefik forwards every domain-prefixed request here first.
        # 200 → X-User-Id / X-User-Roles injected, request forwarded to apps/backend.
        # 401 → request blocked.
        address: "http://user:3000/validate"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-User-Id"
          - "X-User-Roles"

    strip-api-prefix:
      stripPrefix:
        prefixes:
          - "/api"

